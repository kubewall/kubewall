name: Releases

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.26"
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Set up Snapcraft
        run: |
          sudo snap install snapcraft --classic
          mkdir -p "$HOME/.cache/snapcraft/download"
          mkdir -p "$HOME/.cache/snapcraft/stage-packages"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: kubewall
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git for private Go modules
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GORELEASER_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
          KUBEWALL_GO_BUILD_TAGS: podexec
          CI_BUILD: true
          GOPRIVATE: github.com/kubewall/addons
          GONOSUMDB: github.com/kubewall/addons

  helm-release:
    needs: goreleaser
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@fe2588f0fcb2fc9eb2b8c8506d75d0f9c2c5a212 # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Login to GHCR (Helm)
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - name: Package and push Helm chart
        id: helm-push
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          helm package charts/kubewall \
            --version "$VERSION" \
            --app-version "$VERSION"

          OUTPUT=$(helm push "kubewall-${VERSION}.tgz" oci://ghcr.io/kubewall/charts 2>&1)
          echo "$OUTPUT"

          DIGEST=$(echo "$OUTPUT" | awk '/Digest:/ {print $2}')

          if [[ -z "$DIGEST" ]]; then
            echo "Failed to extract OCI digest."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart with cosign
        run: |
          cosign sign --yes \
            "ghcr.io/kubewall/charts/kubewall@${{ steps.helm-push.outputs.digest }}"